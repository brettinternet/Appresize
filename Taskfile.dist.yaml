---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

dotenv: [.env]

vars:
  PROJECT: HyperWindow.xcodeproj
  SCHEME: HyperWindow
  BUILD_DIR: build
  CONFIGURATION_DEBUG: Debug
  CONFIGURATION_RELEASE: Release
  DESTINATION: "platform=macOS"
  RELEASE_APP_PATH: build/Build/Products/Release/HyperWindow.app

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task -l

  clean:
    desc: Clean build artifacts
    cmds:
      - /bin/test ! -e "{{.BUILD_DIR}}" || /usr/bin/trash "{{.BUILD_DIR}}"
      - xcodebuild clean -project "{{.PROJECT}}" -scheme "{{.SCHEME}}"

  build:
    desc: Build the app (Debug)
    cmds:
      - xcodebuild -project "{{.PROJECT}}" -scheme "{{.SCHEME}}" -configuration "{{.CONFIGURATION_DEBUG}}" -derivedDataPath "{{.BUILD_DIR}}" build

  build:release:
    desc: Build, sign, and verify the universal release app
    cmds:
      - ./scripts/build-release.sh

  package:release:
    desc: Build a release DMG and SHA-256 checksum
    requires:
      vars: [RELEASE_TAG]
    cmds:
      - ./scripts/package-release.sh "{{.RELEASE_TAG}}"

  test:build:
    desc: Build tests
    cmds:
      - xcodebuild build-for-testing -project "{{.PROJECT}}" -scheme "{{.SCHEME}}" -configuration "{{.CONFIGURATION_DEBUG}}" -derivedDataPath "{{.BUILD_DIR}}" -destination "{{.DESTINATION}}"

  test:
    desc: Run all tests
    deps: ["test:build"]
    cmds:
      - xcodebuild test-without-building -project "{{.PROJECT}}" -scheme "{{.SCHEME}}" -configuration "{{.CONFIGURATION_DEBUG}}" -derivedDataPath "{{.BUILD_DIR}}" -destination "{{.DESTINATION}}"

  test:unit:
    desc: Run unit tests only (excludes tests that require system permissions)
    deps: ["test:build"]
    cmds:
      - ./scripts/test-preflight.sh xcodebuild test-without-building -project "{{.PROJECT}}" -scheme "{{.SCHEME}}" -configuration "{{.CONFIGURATION_DEBUG}}" -derivedDataPath "{{.BUILD_DIR}}" -destination "{{.DESTINATION}}" -only-testing:HyperWindowTests

  test:all:
    desc: Run all tests (may require manual interaction for permissions)
    deps: ["test:build"]
    cmds:
      - xcodebuild test-without-building -project "{{.PROJECT}}" -scheme "{{.SCHEME}}" -configuration "{{.CONFIGURATION_DEBUG}}" -derivedDataPath "{{.BUILD_DIR}}" -destination "{{.DESTINATION}}" -only-testing:HyperWindowTests

  run:
    desc: Build and run the app (Debug)
    deps: [build]
    cmds:
      - task: open

  run:release:
    desc: Build and run the app (Release)
    deps: ["build:release"]
    cmds:
      - task: open:release

  copy:release:
    desc: Copy the built app release to the Applications folder
    deps: ["build:release"]
    cmds:
      - /usr/bin/xcrun swift ./scripts/install-release.swift "{{.RELEASE_APP_PATH}}" /Applications/HyperWindow.app

  open:
    desc: Run the built app (Debug)
    cmds:
      - open "{{.BUILD_DIR}}/Build/Products/{{.CONFIGURATION_DEBUG}}/HyperWindow.app"

  open:release:
    desc: Run the built app (Release)
    cmds:
      - open "{{.RELEASE_APP_PATH}}"

  archive:
    desc: Create an archive for distribution
    cmds:
      - xcodebuild archive -project "{{.PROJECT}}" -scheme "{{.SCHEME}}" -configuration "{{.CONFIGURATION_RELEASE}}" -derivedDataPath "{{.BUILD_DIR}}" -archivePath "{{.BUILD_DIR}}/HyperWindow.xcarchive"

  dev:
    desc: Quick development cycle (clean, build, test)
    cmds:
      - task: clean
      - task: build
      - task: test

  ci:
    desc: Full CI pipeline (build both configs, test)
    cmds:
      - task: clean
      - task: build
      - task: build:release
      - task: test

  info:
    desc: Show project information
    silent: true
    cmds:
      - "echo 'Project: {{.PROJECT}}'"
      - "echo 'Scheme: {{.SCHEME}}'"
      - "echo 'Build Directory: {{.BUILD_DIR}}'"
      - xcodebuild -version
