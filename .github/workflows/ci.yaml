name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Check release version policy
        run: ./scripts/test-release-version.sh
      - name: Build tests
        run: |
          xcodebuild build-for-testing \
            -project Appresize.xcodeproj \
            -scheme Appresize \
            -configuration Debug \
            -derivedDataPath build \
            -destination 'platform=macOS'
          /usr/bin/xcrun swift ./scripts/sign-local-app.swift \
            build/Build/Products/Debug/Appresize.app
      - name: Run tests
        timeout-minutes: 5
        run: |
          xcodebuild test-without-building \
            -project Appresize.xcodeproj \
            -scheme Appresize \
            -configuration Debug \
            -derivedDataPath build \
            -destination 'platform=macOS' \
            -only-testing:AppresizeTests
      - name: Build and verify release app
        run: ./scripts/build-release.sh

  release:
    name: Test and publish universal macOS release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check release version policy
        run: ./scripts/test-release-version.sh
      - name: Build tests
        run: |
          xcodebuild build-for-testing \
            -project Appresize.xcodeproj \
            -scheme Appresize \
            -configuration Debug \
            -derivedDataPath build \
            -destination 'platform=macOS'
          /usr/bin/xcrun swift ./scripts/sign-local-app.swift \
            build/Build/Products/Debug/Appresize.app
      - name: Run tests
        timeout-minutes: 5
        run: |
          xcodebuild test-without-building \
            -project Appresize.xcodeproj \
            -scheme Appresize \
            -configuration Debug \
            -derivedDataPath build \
            -destination 'platform=macOS' \
            -only-testing:AppresizeTests
      - name: Package release
        run: ./scripts/package-release.sh "$GITHUB_REF_NAME"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: |
            Download `Appresize-…-macos-universal.dmg` and verify its matching SHA-256 checksum.

            The app is universal arm64/x86_64 and ad-hoc signed, not Developer ID signed or notarized. macOS may require Privacy & Security → Open Anyway.
        run: |
          source scripts/release-version.sh
          release_version_parse "$GITHUB_REF_NAME"
          release_flags=()
          if [[ "$RELEASE_IS_PRERELEASE" == 1 ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" \
            "dist/Appresize-${GITHUB_REF_NAME}-macos-universal.dmg#Appresize universal macOS DMG" \
            "dist/Appresize-${GITHUB_REF_NAME}-macos-universal.dmg.sha256#Appresize DMG SHA-256" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            "${release_flags[@]}" \
            --notes "$RELEASE_NOTES" \
            --generate-notes
