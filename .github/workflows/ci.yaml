name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  ci:
    runs-on: macos-15
    if: "!contains(github.event.head_commit.message, 'skipci')"

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build tests
        run: |
          xcodebuild build-for-testing \
                     -project Appresize.xcodeproj \
                     -scheme Appresize \
                     -configuration Debug \
                     -derivedDataPath build \
                     -destination 'platform=macOS'
          /usr/bin/xcrun swift ./scripts/sign-local-app.swift \
            build/Build/Products/Debug/Appresize.app
      
      - name: Run tests (with timeout)
        timeout-minutes: 5
        run: |
          xcodebuild test-without-building \
                     -project Appresize.xcodeproj \
                     -scheme Appresize \
                     -configuration Debug \
                     -derivedDataPath build \
                     -destination 'platform=macOS' \
                     -only-testing:AppresizeTests

      - name: Build app (Release)
        run: |
          xcodebuild -project Appresize.xcodeproj \
                     -scheme Appresize \
                     -configuration Release \
                     -derivedDataPath build \
                     -destination 'generic/platform=macOS' \
                     build
          /usr/bin/xcrun swift ./scripts/sign-local-app.swift \
            build/Build/Products/Release/Appresize.app

      - name: Verify app bundle
        run: |
          APP_PATH="build/Build/Products/Release/Appresize.app"
          BINARY_PATH="$APP_PATH/Contents/MacOS/Appresize"
          if [ ! -d "$APP_PATH" ]; then
            echo "App bundle not found"
            exit 1
          fi
          ARCHS="$(lipo -archs "$BINARY_PATH")"
          [[ "$ARCHS" == *arm64* && "$ARCHS" == *x86_64* ]]
          codesign --verify --deep --strict "$APP_PATH"
          codesign -d --verbose=4 "$APP_PATH" 2>&1 | grep 'flags=.*runtime'

      - name: Upload build artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: appresize-release-build
          path: build/Build/Products/Release/Appresize.app
          retention-days: 7
