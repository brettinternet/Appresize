name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    if: "!contains(github.event.head_commit.message, 'skipci')"

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.version }}
        run: |
          set -euo pipefail
          MARKETING_VERSION="$(xcodebuild -project Appresize.xcodeproj \
            -scheme Appresize \
            -configuration Release \
            -showBuildSettings | \
            awk -F ' = ' '$1 ~ /^[[:space:]]*MARKETING_VERSION$/ { print $2; exit }')"
          ./scripts/validate-release-version.sh "$RELEASE_VERSION" "$MARKETING_VERSION"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build tests
        run: |
          xcodebuild build-for-testing \
                     -project Appresize.xcodeproj \
                     -scheme Appresize \
                     -configuration Debug \
                     -derivedDataPath build \
                     -destination 'platform=macOS'

      - name: Run tests
        timeout-minutes: 5
        run: |
          xcodebuild test-without-building \
                     -project Appresize.xcodeproj \
                     -scheme Appresize \
                     -configuration Debug \
                     -derivedDataPath build \
                     -destination 'platform=macOS' \
                     -only-testing:AppresizeTests

      - name: Build release
        run: |
          xcodebuild -project Appresize.xcodeproj \
                     -scheme Appresize \
                     -configuration Release \
                     -derivedDataPath build \
                     -destination 'generic/platform=macOS' \
                     build

      - name: Verify release
        env:
          RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.version }}
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release/Appresize.app"
          BINARY_PATH="$APP_PATH/Contents/MacOS/Appresize"
          ARCHS="$(lipo -archs "$BINARY_PATH")"
          [[ "$ARCHS" == *arm64* && "$ARCHS" == *x86_64* ]]
          codesign --verify --deep --strict "$APP_PATH"
          codesign -d --verbose=4 "$APP_PATH" 2>&1 | grep 'flags=.*runtime'
          MARKETING_VERSION="$(xcodebuild -project Appresize.xcodeproj \
            -scheme Appresize \
            -configuration Release \
            -showBuildSettings | \
            awk -F ' = ' '$1 ~ /^[[:space:]]*MARKETING_VERSION$/ { print $2; exit }')"
          ./scripts/validate-release-version.sh \
            "$RELEASE_VERSION" "$MARKETING_VERSION" "$APP_PATH/Contents/Info.plist"

      - name: Create DMG
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          # Create a temporary directory for DMG contents
          mkdir -p dmg-staging

          # Copy the app to staging directory
          cp -R "build/Build/Products/Release/Appresize.app" dmg-staging/

          # Create Applications symlink
          ln -s /Applications dmg-staging/Applications

          # Get version from tag or input
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION="$RELEASE_VERSION"
          fi

          # Create DMG
          hdiutil create -volname "Appresize $VERSION" \
                         -srcfolder dmg-staging \
                         -ov -format UDZO \
                         "Appresize-$VERSION.dmg"

          # Verify DMG was created
          ls -la Appresize-*.dmg

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: appresize-build
          path: |
            Appresize-*.dmg
            build/Build/Products/Release/Appresize.app

      - name: Create Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            Appresize-*.dmg
          body: |
            ## Changes

            See the [commit history](/${{ github.repository }}/commits/${{ github.ref_name }}) for details.

            ## Installation

            > This release is ad-hoc signed, not Developer ID signed or notarized. Review the repository README before bypassing macOS Gatekeeper.

            1. Download the DMG file below
            2. Open the DMG and drag Appresize to your Applications folder
            3. Launch Appresize from Applications
            4. Grant accessibility permissions when prompted in System Settings

            ## Requirements

            - macOS 15.2 or later
            - Accessibility permissions for window manipulation
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Manual Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          files: |
            Appresize-*.dmg
          body: |
            ## Changes

            Manual release of Appresize ${{ github.event.inputs.version }}

            ## Installation

            > This release is ad-hoc signed, not Developer ID signed or notarized. Review the repository README before bypassing macOS Gatekeeper.

            1. Download the DMG file below
            2. Open the DMG and drag Appresize to your Applications folder
            3. Launch Appresize from Applications
            4. Grant accessibility permissions when prompted in System Settings

            ## Requirements

            - macOS 15.2 or later
            - Accessibility permissions for window manipulation
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
